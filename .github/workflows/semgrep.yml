name: Semgrep Security Scan
on:
  push:
    branches: ["fixes", "main"]
  pull_request:
    branches: ["fixes", "main"]
jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/ci
            p/python
            p/typescript
            p/react